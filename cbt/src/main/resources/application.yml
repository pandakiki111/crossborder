spring:
  application:
    name: cbt
  datasource:
    # oms와 별도 DB (로컬은 같은 인스턴스의 별도 스키마). oms 테이블은 직접 읽지 않는다
    url: jdbc:mariadb://localhost:3306/crossborder_cbt
    username: cbt
    # 실값은 환경변수로 주입 (로컬은 application-local.yml)
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # cbt DB 마이그레이션은 cbt가 소유한다 (classpath:db/migration, 스키마 설계 전이라 아직 파일 없음)
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8083

crossborder:
  jpa:
    # cbt 자기 엔티티만 스캔 (아직 없음). oms 엔티티는 로드하지 않는다 — 별도 DB(crossborder_cbt)라 validate가 깨진다
    entity-packages: com.crossborder.common.entity.cbt
  jwt:
    # 기본값 없음: 운영에서 JWT_SECRET이 없으면 기동 실패 (로컬은 application-local.yml)
    secret: ${JWT_SECRET}
