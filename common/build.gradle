dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 엔티티 매핑용 API만 compileOnly로 참조 (구현체·런타임은 infra가 공급)
    compileOnly 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.springframework.data:spring-data-commons'
    compileOnly 'org.springframework.data:spring-data-jpa'

    // QueryDSL (OpenFeign fork) - Q클래스 생성. :jakarta classifier는 jakarta.persistence 어노테이션 해석용
    compileOnly "io.github.openfeign.querydsl:querydsl-core:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}
