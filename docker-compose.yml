services:
  mariadb:
    image: mariadb:11.4
    container_name: crossborder-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: crossborder
      MARIADB_USER: app
      MARIADB_PASSWORD: apppass
    volumes:
      - mariadb-data:/var/lib/mysql
      # cbt 스키마(crossborder_cbt)·계정(cbt). 최초 기동(빈 볼륨)에만 실행된다
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: crossborder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mariadb-data:
  redis-data:
