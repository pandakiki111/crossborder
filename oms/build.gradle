plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation project(':infra')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // 주문 엑셀 시딩 (양식 다운로드·업로드 결과 파일)
    implementation "org.apache.poi:poi-ooxml:${poiVersion}"

    // 실제 DB(MariaDB) 대상 리포지토리 테스트. 버전은 docker-compose.yml과 맞춘다
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mariadb'
}

// ./gradlew :oms:bootRun은 로컬 실행이므로 local 프로필(테스트 데이터 시딩) 적용
bootRun {
    systemProperty 'spring.profiles.active', 'local'
}

// 성능 측정용 주문 시딩 엑셀 생성 (README "주문 엑셀 시딩 > 성능" 참고)
// 예: ./gradlew :oms:generateSeedFile -Prows=10000 -Pprefix=P10K
tasks.register('generateSeedFile', JavaExec) {
    group = 'tools'
    description = '성능 측정용 주문 시딩 엑셀 생성 (로컬 테스트 데이터 기준)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.crossborder.oms.service.order.seed.OrderSeedFileGenerator'
    def rows = project.findProperty('rows') ?: '10000'
    def prefix = project.findProperty('prefix') ?: "P${System.currentTimeMillis()}"
    def out = project.findProperty('out') ?: "build/seed/orders-${rows}.xlsx"
    args rows, prefix, out
}
